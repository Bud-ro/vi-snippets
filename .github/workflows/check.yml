name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            /tool/
            /rosetta/manifest.json
            /sources/*/manifest.json
          sparse-checkout-cone-mode: false

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart tool/check.dart
